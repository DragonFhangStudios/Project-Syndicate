# Build verification only: the solution has no test projects yet.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.configuration }})
    # WPF (net8.0-windows) requires a Windows runner.
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ProjectSyndicate.sln

      # MSB9008 (missing project reference) is an error so a broken reference cannot pass silently.
      - name: Build
        run: dotnet build ProjectSyndicate.sln --configuration ${{ matrix.configuration }} --no-restore -warnaserror:MSB9008
